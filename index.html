<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Planos de Fundación HMV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mesa de dibujo: barra superior con el plano en curso, panel de parámetros a la izquierda, lámina a la derecha */
:root {
  --bg: #eef1ef; --panel: #ffffff; --panel-2: #f5f7f6; --ink: #1b2422; --muted: #5d6a66; --line: #d4dcd8;
  --accent: #0e6b57; --accent-2: #d9ece6; --accent-ink: #ffffff;
  --warn: #8a5300; --warn-bg: #fff3dc; --err: #b42318; --err-bg: #fdeceb; --ok: #1f7a3a;
  --paper: #ffffff; --mesa: #dfe5e2;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-cond: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101615; --panel: #172120; --panel-2: #1c2725; --ink: #e3ebe8; --muted: #98a7a2; --line: #2c3a37;
  --accent: #3cb894; --accent-2: #173a31; --accent-ink: #08120f;
  --warn: #f0b44c; --warn-bg: #2d2311; --err: #ff8a80; --err-bg: #341715; --ok: #6fd18c;
  --paper: #f7f9f8; --mesa: #0c1110; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #101615; --panel: #172120; --panel-2: #1c2725; --ink: #e3ebe8; --muted: #98a7a2; --line: #2c3a37;
  --accent: #3cb894; --accent-2: #173a31; --accent-ink: #08120f;
  --warn: #f0b44c; --warn-bg: #2d2311; --err: #ff8a80; --err-bg: #341715; --ok: #6fd18c;
  --paper: #f7f9f8; --mesa: #0c1110; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* barra superior */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.marca { display: flex; flex-direction: column; gap: 2px; min-width: 0; margin-right: auto; }
.marca h1 { margin: 0; font-family: var(--f-cond); font-weight: 600; font-size: 18px; letter-spacing: .01em; }
.codigo { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.campo-sup { display: flex; flex-direction: column; gap: 2px; }
.campo-sup span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
select, input[type="text"], input[type="number"], textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 8px; min-width: 0; }
textarea { width: 100%; resize: vertical; line-height: 1.4; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: var(--r); padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.prim { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.chico { padding: 3px 8px; font-size: 12px; }
.estado { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); max-width: 320px; }
.estado { flex-wrap: wrap; row-gap: 0; }
.autog { flex-basis: 100%; padding-left: 17px; font-size: 11px; opacity: .8; }
.autog:empty { display: none; }
.punto { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
.estado[data-e="listo"] .punto { background: var(--ok); }
.estado[data-e="error"] .punto { background: var(--err); }
.estado[data-e="trabajando"] .punto { animation: latido 1s ease-in-out infinite; }
@keyframes latido { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .estado .punto { animation: none !important; } }

/* cuerpo */
.cuerpo { display: grid; grid-template-columns: minmax(330px, 410px) 1fr; min-height: 0; }
.panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pestanas { display: flex; border-bottom: 1px solid var(--line); padding-left: max(8px, env(safe-area-inset-left, 0px)); }
.pestanas button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 6px; cursor: pointer; color: var(--muted); font-weight: 500; }
.pestanas button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.contenido { overflow: auto; padding-block: 12px 24px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
details.sec { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
details.sec > summary { cursor: pointer; padding: 9px 12px; font-family: var(--f-cond); font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
details.sec > summary::after { content: "+"; color: var(--muted); font-family: var(--f-mono); }
details.sec[open] > summary::after { content: "−"; }
.campos { display: grid; grid-template-columns: 1fr 132px; gap: 8px 10px; padding: 4px 12px 12px; align-items: center; }
.campos label { font-size: 13px; color: var(--muted); line-height: 1.3; }
.campos .ancho { grid-column: 1 / -1; }
.campos input, .campos select { width: 100%; }
.campos input[type="number"] { font-family: var(--f-mono); text-align: right; }
.nota { font-size: 12px; color: var(--muted); line-height: 1.45; }
.fila-btns { display: flex; flex-wrap: wrap; gap: 6px; }

/* listas */
.lista { display: flex; flex-direction: column; gap: 8px; padding: 4px 12px 12px; }
.item { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: start; }
.item .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 7px; text-align: right; }
.item .acc { display: flex; flex-direction: column; gap: 2px; }
.item .acc button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 1px 4px; font-size: 13px; }
.item .acc button:hover { color: var(--accent); }
.multi { display: grid; gap: 4px; }

/* tablas */
.tabla-env { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 7px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-weight: 600; color: var(--muted); background: var(--panel-2); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
td.num { text-align: right; font-family: var(--f-mono); }
td input { width: 64px; padding: 3px 5px; font-family: var(--f-mono); text-align: right; }
td input.txt { width: 110px; text-align: left; font-family: var(--f-ui); }
.cid { font-size: 12px; color: var(--muted); white-space: normal; min-width: 120px; max-width: 150px; line-height: 1.3; }
.avisos { display: flex; flex-direction: column; gap: 6px; }
.aviso { background: var(--warn-bg); color: var(--warn); border-radius: var(--r); padding: 8px 10px; font-size: 13px; }
.error { background: var(--err-bg); color: var(--err); border-radius: var(--r); padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.cifra { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.cifra b { display: block; font-family: var(--f-mono); font-size: 16px; font-weight: 500; }
.cifra span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-2); border-radius: 99px; padding: 2px 4px 2px 9px; font-family: var(--f-mono); font-size: 12px; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1; padding: 2px 4px; }
.chip button:hover { color: var(--err); }
.subt { font-family: var(--f-cond); font-weight: 600; font-size: 14px; margin: 4px 0 0; }

/* visor */
.visor { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.vistas { display: flex; gap: 4px; overflow-x: auto; padding-block: 8px; padding-left: 10px; padding-right: max(10px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.vistas button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 99px; padding: 5px 11px; cursor: pointer; white-space: nowrap; font-family: var(--f-cond); font-weight: 500; font-size: 13px; }
.vistas button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mesa { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--mesa); cursor: grab; touch-action: none; }
.mesa.arrastrando { cursor: grabbing; }
.hoja { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--paper); box-shadow: 0 2px 14px rgb(0 0 0 / .18); }
.hoja svg { display: block; }
.controles { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; gap: 6px; }
.controles button { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
.leyenda { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 9px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.cargando { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
.cargando b { display: block; font-family: var(--f-cond); font-size: 18px; color: var(--ink); margin-bottom: 6px; }
.cargando .barra-p { width: min(320px, 70vw); height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 14px auto 0; }
.cargando .barra-p i { display: block; height: 100%; width: 35%; background: var(--accent); animation: avance 1.4s ease-in-out infinite; }
@keyframes avance { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { .cargando .barra-p i { animation: none; width: 100%; } }

@media (max-width: 860px) {
  .cuerpo { grid-template-columns: 1fr; grid-template-rows: auto minmax(420px, 70vh); }
  .panel { border-right: 0; border-bottom: 1px solid var(--line); max-height: 60vh; }
  .visor { order: -1; }
  .codigo { max-width: 90vw; }
}
</style>

<div class="app">
  <header class="barra">
    <div class="marca">
      <h1>Planos de Fundación HMV</h1>
      <div class="codigo" id="codigo">Preparando…</div>
    </div>
    <div class="grupo">
      <label class="campo-sup"><span>Tipo de plano</span>
        <select id="sel-tipo" disabled>
          <option value="marco">Marco (MLDV / MB…)</option>
          <option value="dt">Desconectador tripolar</option>
        </select></label>
      <label class="campo-sup"><span>Caso</span>
        <select id="sel-caso" disabled></select></label>
    </div>
    <div class="grupo">
      <button class="btn" id="btn-abrir" disabled>Abrir caso…</button>
      <button class="btn" id="btn-deshacer" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled>↶</button>
      <button class="btn" id="btn-rehacer" title="Rehacer (Ctrl+Y)" aria-label="Rehacer" disabled>↷</button>
      <button class="btn" id="btn-guardar" disabled>Guardar caso</button>
      <button class="btn prim" id="btn-zip" disabled>DXF + LISP (.zip)</button>
      <button class="btn prim" id="btn-pdf" disabled>PDF</button>
      <input type="file" id="f-caso" accept=".json,application/json" hidden>
      <input type="file" id="f-plantilla" accept=".dxf" hidden>
      <input type="file" id="f-formato" accept=".dxf" hidden>
      <input type="file" id="f-planilla" accept=".xlsx,.xlsm" hidden>
    </div>
    <div class="estado" id="estado" data-e="trabajando" role="status" aria-live="polite"><i class="punto"></i><span id="estado-txt">Cargando Python en el navegador…</span><span id="autoguardado" class="autog" title="Cada cambio se guarda solo en este navegador"></span></div>
  </header>

  <div class="cuerpo">
    <aside class="panel">
      <div class="pestanas" role="tablist">
        <button role="tab" id="t-param" aria-selected="true">Parámetros</button>
        <button role="tab" id="t-listas" aria-selected="false">Listas</button>
        <button role="tab" id="t-cotas" aria-selected="false">Cotas</button>
        <button role="tab" id="t-resumen" aria-selected="false">Resumen</button>
      </div>
      <div class="contenido" id="p-param"><p class="nota">Los parámetros aparecen cuando termina de cargar Python (la primera vez tarda unos 20–40 s).</p></div>
      <div class="contenido" id="p-listas" hidden></div>
      <div class="contenido" id="p-cotas" hidden></div>
      <div class="contenido" id="p-resumen" hidden></div>
    </aside>

    <section class="visor">
      <nav class="vistas" id="vistas" aria-label="Vistas del plano"></nav>
      <div class="mesa" id="mesa">
        <div class="hoja" id="hoja"></div>
        <div class="cargando" id="cargando"><div><b>Preparando la mesa de dibujo</b><span id="cargando-txt">Cargando Python, ezdxf y el programa de planos…</span><div class="barra-p"><i></i></div></div></div>
        <div class="leyenda" id="leyenda" hidden></div>
        <div class="controles">
          <button id="z-mas" aria-label="Acercar">+</button>
          <button id="z-menos" aria-label="Alejar">−</button>
          <button id="z-ajustar" aria-label="Ajustar a la ventana">⤢</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/svg2pdf.umd.min.js"></script>
<script>
(() => {
  "use strict";
  // ---------------------------------------------------------------- worker (Python)
  const worker = new Worker("worker.js");
  let sec = 0;
  const pendientes = new Map();
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.progreso) { $("cargando-txt").textContent = m.progreso; estado(m.progreso, "trabajando"); return; }
    const p = pendientes.get(m.id);
    if (!p) return;
    pendientes.delete(m.id);
    m.ok ? p.resolve(m.valor) : p.reject(new Error(m.error));
  };
  const py = (fn, ...args) => new Promise((resolve, reject) => {
    const id = ++sec;
    pendientes.set(id, { resolve, reject });
    worker.postMessage({ id, fn, args });
  });

  // ---------------------------------------------------------------- utilidades
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...hijos) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
    }
    for (const h of hijos.flat()) if (h !== null && h !== undefined) e.append(h instanceof Node ? h : document.createTextNode(h));
    return e;
  };
  const fmt = (v, d = 2) => (v === null || v === undefined || isNaN(v)) ? "—" :
    Number(v).toLocaleString("es-CL", { minimumFractionDigits: d, maximumFractionDigits: d });
  const fmtCm = (v) => Number.isInteger(+v) ? String(+v) : String(Math.round(+v * 10) / 10).replace(".", ",");
  function estado(txt, e = "listo") { $("estado").dataset.e = e; $("estado-txt").textContent = txt; }
  const guardarLocal = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
  const leerLocal = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (_) { return null; } };

  // ---------------------------------------------------------------- estado
  let meta = null, P = null, R = null, nombreCaso = "", vista = "PLANTA";
  const cacheSvg = new Map();
  let generando = false, otraVez = false, temporizador = null;
  const esDT = () => String(P && P.tipo_plano || "").startsWith("Fundación desconectador");
  const nombres = () => (R && R.nombres) || (esDT() ? meta.nombres_dt : meta.nombres_marco);

  // ---------------------------------------------------------------- pestañas
  const tabs = ["param", "listas", "cotas", "resumen"];
  for (const t of tabs) $("t-" + t).addEventListener("click", () => {
    for (const u of tabs) { $("t-" + u).setAttribute("aria-selected", u === t); $("p-" + u).hidden = u !== t; }
    guardarLocal("hmv_tab", t);
  });

  // ---------------------------------------------------------------- formulario de parámetros
  function construirParametros() {
    const cont = $("p-param");
    cont.replaceChildren();
    const porGrupo = {};
    for (const d of meta.params) (porGrupo[d.grupo] ||= []).push(d);
    for (const g of meta.grupos) {
      if (g.startsWith("DT") && !esDT()) continue;
      const det = el("details", { class: "sec", open: g === "Formato" || g.startsWith("DT") ? true : null });
      det.append(el("summary", {}, g));
      const campos = el("div", { class: "campos" });
      for (const d of porGrupo[g]) {
        const id = "par-" + d.clave;
        const v = P[d.clave];
        let inp;
        if (d.opciones) {
          inp = el("select", { id });
          for (const o of d.opciones) inp.append(el("option", { value: o, selected: String(v) === String(o) ? true : null }, o));
        } else if (d.tipo === "int" || d.tipo === "float") {
          inp = el("input", { id, type: "number", step: d.tipo === "int" ? "1" : "any", value: v });
        } else {
          inp = el("input", { id, type: "text", value: v ?? "" });
        }
        inp.addEventListener("change", () => {
          let nv = inp.value;
          if (d.tipo === "int") nv = parseInt(nv || "0", 10);
          else if (d.tipo === "float") nv = parseFloat(String(nv).replace(",", ".") || "0");
          if ((d.tipo === "int" || d.tipo === "float") && isNaN(nv)) { inp.setAttribute("aria-invalid", "true"); return; }
          inp.removeAttribute("aria-invalid");
          P[d.clave] = nv;
          if (d.clave === "tipo_plano") { construirParametros(); construirVistas(); }
          programar();
        });
        const largo = d.tipo === "str" && !d.opciones && String(v ?? "").length > 14;
        campos.append(el("label", { for: id, class: largo ? "ancho" : null }, d.etiqueta), largo ? el("div", { class: "ancho" }, inp) : inp);
        if (largo) inp.style.width = "100%";
      }
      if (g === "Formato") {
        campos.append(el("div", { class: "ancho fila-btns" },
          el("button", { class: "btn chico", onclick: () => $("f-plantilla").click() }, "Subir plantilla DXF…"),
          el("button", { class: "btn chico", onclick: () => $("f-formato").click() }, "Subir formato del cliente (DXF)…"),
          el("button", { class: "btn chico", onclick: () => $("f-planilla").click() }, "Importar planilla Excel…")),
          el("p", { class: "nota ancho" }, "En la web la plantilla y el formato se suben como DXF (si tiene DWG, ábralo en su CAD y guárdelo como DXF)."));
      }
      det.append(campos);
      cont.append(det);
    }
  }

  // ---------------------------------------------------------------- listas (notas, referencias, revisiones)
  const LISTAS = [
    { clave: "notas", titulo: "Notas del plano", cols: ["Nota"], multilinea: true, simple: true },
    { clave: "notas_juntas", titulo: "Notas de juntas frías", cols: ["Nota"], multilinea: true, simple: true },
    { clave: "referencias", titulo: "Referencias", cols: ["Código", "Descripción"] },
    { clave: "revisiones", titulo: "Revisiones", cols: ["Rev.", "Fecha", "Descripción", "Ejecutó", "Revisó", "Aprobó"] },
    { clave: "rotulos_extra", titulo: "Rótulos agregados", cols: ["Vista", "X punta", "Y punta", "X texto", "Y texto", "Texto", "Color"] },
    { clave: "cotas_extra", titulo: "Cotas agregadas", cols: ["Vista", "X1", "Y1", "X2", "Y2", "X línea", "Y línea", "Tipo", "Texto"] },
    { clave: "cotas_grupo", titulo: "Cotas de grupo", cols: ["Vista", "Elementos", "Desde n°", "Hasta n°", "Distancia (mm)", "Texto"] },
    { clave: "pernos_pos", titulo: "Pernos de anclaje (disposición manual)", cols: ["X (cm)", "Y (cm)"],

    if (!R || !R.ok) return;
    const clave = vista + "|" + (vista === "HOJA" ? (P.ctb || "") : "");
    if (cacheSvg.has(clave)) { ponerSvg(cacheSvg.get(clave), leyendaDe(vista)); return; }
    $("cargando").hidden = false;
    $("cargando-txt").textContent = vista === "HOJA" ? "Dibujando la lámina completa con el CTB (puede tardar cerca de un minuto)…" : "Dibujando la vista…";
    estado(vista === "HOJA" ? "Dibujando la lámina completa…" : "Dibujando la vista…", "trabajando");
    try {
      const s = vista === "HOJA" ? await py("svg_lamina", P.ctb || "", P.papel_plot && P.papel_plot !== "Según plantilla" ? P.papel_plot : "A0")
                                 : await py("svg_vista", vista);
      cacheSvg.set(clave, s);
      if (clave.startsWith(vista + "|")) ponerSvg(s, leyendaDe(vista));
      estado("Listo", "listo");
    } catch (e) { estado("No se pudo dibujar: " + e.message, "error"); }
    $("cargando").hidden = true;
  }
  function leyendaDe(v) {
    if (v === "HOJA") return `Lámina · CTB ${P.ctb || "GN-PLOT-HMV.ctb"}`;
    const k = { PLANTA: "esc_planta", AA_FORMAS: "esc_aaf", BB_FORMAS: "esc_bbf", AA_ARM: "esc_aaa", BB_ARM: "esc_bba", CC: "esc_cc", ESQUEMA: "esc_esq" }[v];
    return `${(nombres()[v] || v)} · ESC 1:${P[k]}`;
  }
  // pan / zoom
  const mesa = $("mesa");
  let arr = null;
  mesa.addEventListener("pointerdown", (e) => { if (e.target.closest(".controles")) return; arr = { x: e.clientX - vx, y: e.clientY - vy }; mesa.classList.add("arrastrando"); mesa.setPointerCapture(e.pointerId); });
  mesa.addEventListener("pointermove", (e) => { if (!arr) return; vx = e.clientX - arr.x; vy = e.clientY - arr.y; aplicarTransform(); });
  mesa.addEventListener("pointerup", () => { arr = null; mesa.classList.remove("arrastrando"); });
  mesa.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = mesa.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const f = e.deltaY < 0 ? 1.18 : 1 / 1.18;
    vx = mx - (mx - vx) * f; vy = my - (my - vy) * f; vk *= f; aplicarTransform();
  }, { passive: false });
  mesa.addEventListener("dblclick", ajustar);
  const zoom = (f) => { const r = mesa.getBoundingClientRect(); const mx = r.width / 2, my = r.height / 2; vx = mx - (mx - vx) * f; vy = my - (my - vy) * f; vk *= f; aplicarTransform(); };
  $("z-mas").onclick = () => zoom(1.25); $("z-menos").onclick = () => zoom(0.8); $("z-ajustar").onclick = ajustar;
  window.addEventListener("resize", ajustar);

  // ---------------------------------------------------------------- generación
  // autoguardado: cada cambio queda en este navegador (último + historial de 25 estados, uno por minuto)
  let ultimoHist = 0;
  function autoguardar() {
    if (!P) return;
    const ahora = new Date();
    guardarLocal("hmv_trabajo", { caso: nombreCaso, p: P, guardado: ahora.toISOString() });
    if (Date.now() - ultimoHist > 60000) {
      ultimoHist = Date.now();
      const h = leerLocal("hmv_historial") || [];
      h.unshift({ caso: nombreCaso, p: P, guardado: ahora.toISOString() });
      guardarLocal("hmv_historial", h.slice(0, 25));
    }
    const a = $("autoguardado");
    if (a) a.textContent = "Autoguardado " + ahora.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  function programar() { autoguardar(); clearTimeout(temporizador); temporizador = setTimeout(generar, 650); }

  // deshacer / rehacer: un estado por cada plano generado
  const hist = []; let histI = -1, histAplicando = false;
  function histRegistrar() {
    if (histAplicando || !P) return;
    const j = JSON.stringify(P);
    if (histI >= 0 && hist[histI] === j) return;
    hist.splice(histI + 1);
    hist.push(j);
    if (hist.length > 200) hist.shift();
    histI = hist.length - 1;
    histBotones();
  }
  function histBotones() {
    $("btn-deshacer").disabled = histI <= 0;
    $("btn-rehacer").disabled = histI >= hist.length - 1;
  }
  async function histIr(i) {
    if (i < 0 || i >= hist.length) return;
    histI = i; histAplicando = true;
    P = JSON.parse(hist[i]);
    construirParametros(); construirListas();
    await generar();
    histAplicando = false; histBotones();
    autoguardar();
  }
  $("btn-deshacer").addEventListener("click", () => histIr(histI - 1));
  $("btn-rehacer").addEventListener("click", () => histIr(histI + 1));
  document.addEventListener("keydown", (ev) => {
    const t = ev.target && ev.target.tagName;
    if (["INPUT", "TEXTAREA", "SELECT"].includes(t)) return;
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey) {
      const k = ev.key.toLowerCase();
      if (k === "z" && !ev.shiftKey) { ev.preventDefault(); histIr(histI - 1); }
      else if (k === "y" || (k === "z" && ev.shiftKey)) { ev.preventDefault(); histIr(histI + 1); }
    }
  });
  async function generar() {
    if (generando) { otraVez = true; return; }
    generando = true;
    estado("Generando el plano…", "trabajando");
    try {
      R = JSON.parse(await py("generar", JSON.stringify(P)));
      cacheSvg.clear();
      if (!R.ok) { estado("Error al generar: " + R.error, "error"); construirResumen(); }
      else {
        estado(R.avisos.length ? `Listo · ${R.avisos.length} aviso(s) en Resumen` : `Listo · generado en ${fmt(R.segundos, 1)} s`, "listo");
        $("codigo").textContent = `${P.codigo || ""} · ${nombreCaso}` + (R.dt ? " · desconectador tripolar" : "");
        construirVistas(); construirResumen(); construirCotas(); refrescarTC(); histRegistrar();
        await mostrarVista();
        autoguardar();
      }
    } catch (e) { estado("Error: " + e.message, "error"); }
    generando = false;
    if (otraVez) { otraVez = false; generar(); }
  }

  // ---------------------------------------------------------------- casos y archivos
  function llenarCasos() {
    const s = $("sel-caso");
    s.replaceChildren();
    const t = esDT() ? "dt" : "marco";
    for (const c of meta.casos.filter((c) => c.tipo === t)) s.append(el("option", { value: c.archivo, selected: c.nombre === nombreCaso ? true : null }, c.nombre));
    if (!meta.casos.some((c) => c.nombre === nombreCaso)) s.prepend(el("option", { value: "", selected: true }, nombreCaso || "Caso propio"));
    $("sel-tipo").value = t;
  }
  async function cargarCaso(archivo) {
    P = JSON.parse(await py("cargar_caso", archivo));
    nombreCaso = archivo.replace("_parametros.json", "");
    todo();
  }
  function todo() { llenarCasos(); construirParametros(); construirListas(); construirVistas(); generar(); }

  $("sel-caso").addEventListener("change", (e) => { if (e.target.value) cargarCaso(e.target.value); });
  $("sel-tipo").addEventListener("change", (e) => {
    const c = meta.casos.find((c) => c.tipo === e.target.value);
    if (c) cargarCaso(c.archivo);
  });
  $("btn-abrir").onclick = () => $("f-caso").click();
  $("f-caso").addEventListener("change", async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { P = JSON.parse(await py("normalizar", await f.text())); nombreCaso = f.name.replace(/(_parametros)?\.json$/i, ""); todo(); }
    catch (err) { estado("No se pudo leer el caso: " + err.message, "error"); }
    e.target.value = "";
  });
  async function subir(input, alListo) {
    input.addEventListener("change", async (e) => {
      const f = e.target.files[0]; if (!f) return;
      estado("Subiendo " + f.name + "…", "trabajando");
      try { const ruta = await py("subir", f.name, new Uint8Array(await f.arrayBuffer())); await alListo(ruta, f.name); }
      catch (err) { estado("No se pudo usar el archivo: " + err.message, "error"); }
      e.target.value = "";
    });
  }
  subir($("f-plantilla"), async (ruta) => { P.plantilla = ruta; construirParametros(); generar(); });
  subir($("f-formato"), async (ruta) => { P.formato_archivo = ruta; P.formato = meta.params.find((d) => d.clave === "formato").opciones[2]; construirParametros(); generar(); });
  subir($("f-planilla"), async (ruta) => {
    const r = JSON.parse(await py("importar_planilla", ruta, JSON.stringify(P)));
    if (!r.ok) { estado("No se pudo importar la planilla: " + r.error, "error"); return; }
    P = r.params; construirParametros(); generar();
  });

  // descargas (la página no puede descargar sola: se usa el permiso «downloads» del visor)
  let dl = null;
  const descargas = async () => (dl ||= (window.claude && window.claude.use) ? await window.claude.use("downloads") : null);
  async function guardar(nombre, datos) {
    const d = await descargas();
    if (!d) {                                    // fuera de claude.ai (GitHub Pages, Netlify, servidor propio)
      const url = URL.createObjectURL(datos instanceof Blob ? datos : new Blob([datos]));
      const a = el("a", { href: url, download: nombre });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      estado("Archivo descargado: " + nombre, "listo");
      return;
    }
    try { await d.save({ filename: nombre, data: datos }); estado("Archivo entregado: " + nombre, "listo"); }
    catch (e) { estado(e && e.code === "declined" ? "Descarga cancelada" : "No se pudo guardar: " + ((e && e.message) || e), e && e.code === "declined" ? "listo" : "error"); }
  }
  $("btn-guardar").onclick = () => guardar(`${(P.codigo || nombreCaso || "caso")}_parametros.json`, JSON.stringify(P, null, 2));
  $("btn-zip").onclick = async () => {
    estado("Preparando DXF + LISP…", "trabajando");
    try { const z = await py("exportar_zip", JSON.stringify(P)); await guardar(`${P.codigo || "plano"}.zip`, new Blob([z], { type: "application/zip" })); }
    catch (e) { estado("No se pudo exportar: " + e.message, "error"); }
  };
  $("btn-pdf").onclick = async () => {
    try {
      estado("Dibujando la lámina para el PDF (cerca de un minuto)…", "trabajando");
      const hoja = P.papel_plot && P.papel_plot !== "Según plantilla" ? P.papel_plot : "A0";
      const clave = "HOJA|" + (P.ctb || "");
      const txt = cacheSvg.get(clave) || await py("svg_lamina", P.ctb || "", hoja);
      cacheSvg.set(clave, txt);
      estado("Armando el PDF…", "trabajando");
      const tam = { A0: [1189, 841], A1: [841, 594], A2: [594, 420], A3: [420, 297], A4: [297, 210] }[hoja] || [1189, 841];
      const svgEl = new DOMParser().parseFromString(txt.replace(/^<\?xml[^>]*>\s*/, ""), "image/svg+xml").documentElement;
      const doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "mm", format: tam, compress: true });
      await doc.svg(svgEl, { x: 0, y: 0, width: tam[0], height: tam[1] });
      await guardar(`${P.codigo || "plano"}.pdf`, doc.output("blob"));
    } catch (e) { estado("No se pudo armar el PDF: " + e.message, "error"); }
  };

  window.addEventListener("pagehide", autoguardar);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") autoguardar(); });

  // ---------------------------------------------------------------- inicio
  (async () => {
    try {
      meta = JSON.parse(await py("init"));
      for (const id of ["sel-tipo", "sel-caso", "btn-abrir", "btn-guardar", "btn-zip", "btn-pdf"]) $(id).disabled = false;
      const t = leerLocal("hmv_tab");
      if (t && tabs.includes(t)) $("t-" + t).click();
      const previo = leerLocal("hmv_trabajo");
      if (previo && previo.p && previo.p.codigo) {
        P = JSON.parse(await py("normalizar", JSON.stringify(previo.p)));
        nombreCaso = previo.caso || "Último trabajo";
        todo();
        if (previo.guardado) setTimeout(() => { const a = $("autoguardado"); if (a) a.textContent = "Recuperado el trabajo del " + new Date(previo.guardado).toLocaleString("es-CL"); }, 50);
      } else {
        const c = meta.casos.find((c) => c.nombre.startsWith("MLDV")) || meta.casos[0];
        await cargarCaso(c.archivo);
      }
    } catch (e) {
      $("cargando-txt").textContent = "No se pudo iniciar Python en este navegador: " + e.message;
      estado("No se pudo iniciar: " + e.message, "error");
    }
  })();
})();
</script>
